<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backseat Selector</title>
    <link rel="stylesheet" href="./selector.css" />
  </head>
  <body>
    <img id="shot" alt="" draggable="false" />
    <canvas id="overlay"></canvas>
    <div id="size"></div>
    <div id="hint" data-i18n="selector.hint.rect">드래그로 영역 선택 · Enter 확인 · Esc 취소</div>
    <div id="modes">
      <button type="button" tabindex="-1" data-mode="rect"><span data-i18n="selector.mode.rect">사각형</span> R</button>
      <button type="button" tabindex="-1" data-mode="window"><span data-i18n="selector.mode.window">창</span> W</button>
      <button type="button" tabindex="-1" data-mode="full"><span data-i18n="selector.mode.full">전체</span> F</button>
      <button type="button" tabindex="-1" data-mode="scroll"><span data-i18n="selector.mode.scroll">스크롤</span> S</button>
    </div>
    <script type="module" src="./selector.ts"></script>
  </body>
</html>
