<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backseat</title>
    <link rel="stylesheet" href="./editor.css" />
    <script type="module" src="./editor.ts"></script>
  </head>
  <body>
    <header id="toolbar">
      <div class="group" role="group" aria-label="도구">
        <button type="button" class="btn active" data-tool="pen" title="펜">펜</button>
        <button type="button" class="btn" data-tool="text" title="텍스트">텍스트</button>
        <button type="button" class="btn" data-tool="arrow" title="화살표">화살</button>
        <button type="button" class="btn" data-tool="rect" title="사각형">사각</button>
        <button type="button" class="btn" data-tool="badge" title="번호">번호</button>
        <button type="button" class="btn" data-tool="blur" title="블러">블러</button>
        <button type="button" class="btn" data-tool="crop" title="자르기">자르기</button>
      </div>
      <div class="group" role="group" aria-label="색상">
        <button type="button" class="swatch active" data-color="#E5484D" style="--c: #E5484D" title="빨강" aria-label="빨강"></button>
        <button type="button" class="swatch" data-color="#F5A623" style="--c: #F5A623" title="노랑" aria-label="노랑"></button>
        <button type="button" class="swatch" data-color="#2F80ED" style="--c: #2F80ED" title="파랑" aria-label="파랑"></button>
      </div>
      <div class="group" role="group" aria-label="굵기">
        <button type="button" class="btn active" data-width="3" title="얇게">얇게</button>
        <button type="button" class="btn" data-width="6" title="굵게">굵게</button>
      </div>
      <div class="group" role="group" aria-label="히스토리">
        <button type="button" class="btn" id="undo" data-command="undo" aria-label="되돌리기">↶</button>
        <button type="button" class="btn" id="redo" data-command="redo" aria-label="다시 실행">↷</button>
      </div>
      <button type="button" class="btn" id="timeline-toggle" data-command="timeline">타임라인</button>
      <button type="button" class="btn" id="pin" data-command="pin" aria-label="고정">📌</button>
      <button type="button" class="btn" id="mic" data-command="mic">🎤 녹음</button>
      <div class="spacer"></div>
      <button type="button" class="btn" id="copy" data-command="copy">복사</button>
      <button type="button" class="btn" id="save" data-command="save">저장</button>
      <button type="button" class="btn primary" id="send" data-command="send">전송</button>
    </header>

    <div id="targetbar" role="status"></div>

    <div id="comparebar" hidden aria-label="이전 캡처와 비교">
      <button type="button" class="btn cmp-btn" id="compare-toggle" data-command="compare">전/후 비교</button>
      <span class="cmp-modes" role="group" aria-label="비교 모드">
        <button type="button" class="btn cmp-btn active" data-cmp-mode="overlay" title="이전 캡처를 반투명으로 겹침">겹치기</button>
        <button type="button" class="btn cmp-btn" data-cmp-mode="wipe" title="세로선 왼쪽은 이전, 오른쪽은 현재">와이프</button>
        <button type="button" class="btn cmp-btn" data-cmp-mode="diff" title="달라진 부분만 밝게">차이</button>
      </span>
      <label class="cmp-slider">불투명도 <input id="cmp-opacity" type="range" min="0" max="100" value="50" /></label>
      <label class="cmp-slider off">위치 <input id="cmp-wipe" type="range" min="0" max="100" value="50" /></label>
      <span id="cmp-diff" class="cmp-diff"></span>
    </div>

    <main id="stage">
      <div id="wrap">
        <canvas id="base"></canvas>
        <canvas id="cmp"></canvas>
        <canvas id="ink"></canvas>
      </div>
    </main>

    <section id="timeline" hidden aria-label="타임라인">
      <div class="tl-bar">
        <button type="button" class="btn tl-btn" data-tl="play" title="재생/일시정지 (Space)">▶</button>
        <button type="button" class="btn tl-btn" data-tl="live" title="라이브로 (End)">LIVE</button>
        <span class="tl-clock" data-tl="clock"></span>
        <span class="spacer"></span>
        <span class="tl-hint">드래그로 스크럽 · ←→ 0.2초 · Home 처음</span>
        <button type="button" class="btn tl-btn" data-command="video">녹화</button>
      </div>
      <canvas id="tl-canvas"></canvas>
    </section>

    <audio id="player" hidden preload="auto"></audio>

    <footer>
      <input id="memo" type="text" autocomplete="off" spellcheck="false" placeholder="이 이미지에 대한 한 줄 메모 (선택)" />
      <span id="status" role="status"></span>
    </footer>
  </body>
</html>
