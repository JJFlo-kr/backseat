<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Backseat concept A: someone in the back seat, arm up, pointing at the windshield -->
  <defs>
    <clipPath id="a-clip"><circle cx="128" cy="128" r="128"/></clipPath>
    <g id="a-arm">
      <!-- local frame: +x is the pointing direction, origin at the knuckles -->
      <rect x="-96" y="-15" width="100" height="30" rx="15"/>
      <rect x="-8" y="-22" width="44" height="44" rx="14"/>
      <rect x="18" y="-22" width="50" height="18" rx="9"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="128" fill="#E5484D"/>
  <g clip-path="url(#a-clip)">
    <!-- seat back, seen from behind; runs off the bottom of the badge -->
    <rect x="44" y="140" width="124" height="140" rx="32" fill="#FFFFFF"/>
    <!-- head above the seat -->
    <circle cx="106" cy="98" r="32" fill="#FFFFFF"/>
    <!-- raised arm: red halo first so it separates from seat and head -->
    <g transform="translate(184 120) rotate(-52)">
      <use href="#a-arm" fill="#E5484D" stroke="#E5484D" stroke-width="16" stroke-linejoin="round"/>
      <use href="#a-arm" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
