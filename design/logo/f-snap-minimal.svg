<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Backseat concept F: snap pictogram, thumb and middle finger pinched together, three-tick burst -->
  <defs>
    <clipPath id="f-clip"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="128" fill="#E5484D"/>
  <g clip-path="url(#f-clip)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- wrist coming in from the lower left -->
    <line x1="92" y1="176" x2="40" y2="290" stroke-width="40"/>
    <!-- middle finger: up from the wrist, knuckle, then down onto the thumb tip -->
    <path d="M90 170 L106 100 L166 106" stroke-width="36"/>
    <!-- thumb: straight to the same point -->
    <path d="M94 176 L160 126" stroke-width="36"/>
  </g>
  <!-- three-tick burst at the contact point (~170,116) -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <line x1="192" y1="80" x2="206" y2="58"/>
    <line x1="206" y1="112" x2="232" y2="108"/>
    <line x1="200" y1="144" x2="220" y2="160"/>
  </g>
</svg>
