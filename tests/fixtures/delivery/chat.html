<!doctype html>
<!-- Fake AI chat for the delivery self-test (src/main/selftest-delivery.ts). Title contains "ChatGPT" so
     Backseat treats the browser tab as an AI chat. Reports its fields to the harness; no real service. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatGPT · Backseat fake chat</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; background: #f6f6f8; color: #222; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
  header b { flex: 1; }
  main { padding: 16px; }
  .msg { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; max-width: 520px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; font: inherit; }
</style>
</head>
<body>
<header><b id="name">Fake chat</b><button id="newchat" type="button">New chat</button></header>
<main><div class="msg">This is a fake chat window for testing Backseat. Nothing here is sent anywhere.</div></main>
<footer><textarea id="prompt" placeholder="Message the fake AI"></textarea></footer>
<script>
  const q = new URLSearchParams(location.search)
  const id = q.get('id') || 'chat'
  const port = q.get('port')
  document.title = q.get('title') || document.title
  document.getElementById('name').textContent = document.title
  const prompt = document.getElementById('prompt')
  const field = (el) => ({ len: el.value.length, marker: el.value.includes('Backseat') })
  let stealMs = 0
  window.addEventListener('focus', () => {
    // Scenario "focus moves right before Ctrl+V": something in the page grabs the focus after activation.
    if (stealMs > 0) setTimeout(() => document.getElementById('newchat').focus(), stealMs)
  })
  async function report() {
    const state = { page: id, title: document.title, active: document.activeElement ? document.activeElement.id : '', prompt: field(prompt) }
    try { await fetch(`http://127.0.0.1:${port}/state`, { method: 'POST', body: JSON.stringify(state) }) } catch {}
  }
  async function poll() {
    try {
      const r = await fetch(`http://127.0.0.1:${port}/cmd?page=${encodeURIComponent(id)}`)
      const cmd = await r.json()
      if (cmd.clear) prompt.value = ''
      if (cmd.title) { document.title = cmd.title; document.getElementById('name').textContent = cmd.title }
      if (cmd.focus === 'prompt') prompt.focus()
      if (cmd.focus === 'button') document.getElementById('newchat').focus()
      if (typeof cmd.stealMs === 'number') stealMs = cmd.stealMs
    } catch {}
    await report()
    setTimeout(poll, 120)
  }
  poll()
</script>
</body>
</html>
